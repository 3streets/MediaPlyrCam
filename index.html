<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Y2K Media Player Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,700&family=VT323&family=Press+Start+2P&family=Pacifico&family=Courier+Prime:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#e8489a; --accent-deep:#a8226a; --accent-light:#ffc6e4;
    --chrome:#f4d4e4; --glass:#ffd0e6; --ink:#3a0d24; --titlebar-text:#fff7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tinos',serif;background:#07060a;color:#fff;min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:34px 16px 60px;gap:26px;overflow-x:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 18% 12%, rgba(232,72,154,.18), transparent 42%),
      radial-gradient(circle at 84% 88%, rgba(120,80,200,.16), transparent 46%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px),
      #07060a;
    animation:bgshift 9s steps(8) infinite;
  }
  @keyframes bgshift{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(1px,-2px);}
    75%{transform:translate(-1px,2px);}
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.45;
    animation:flick 5s steps(20) infinite;
  }
  @keyframes flick{
    0%,96%,100%{opacity:.45;}
    97%{opacity:.15;}98%{opacity:.62;}99%{opacity:.28;}
  }

  .page-title{
    font-family:'VT323',monospace;font-size:30px;letter-spacing:2px;
    color:var(--accent-light);text-align:center;
    text-shadow:2px 0 #ff2d8f,-2px 0 #00e5ff;
    animation:rgbjit 4s steps(10) infinite;
  }
  @keyframes rgbjit{
    0%,90%,100%{text-shadow:2px 0 #ff2d8f,-2px 0 #00e5ff;transform:translateX(0);}
    92%{text-shadow:4px 0 #ff2d8f,-4px 0 #00e5ff;transform:translateX(-2px);}
    94%{text-shadow:-3px 0 #ff2d8f,3px 0 #00e5ff;transform:translateX(2px);}
  }
  .page-title small{
    display:block;font-size:14px;letter-spacing:5px;color:#b98;
    margin-top:2px;text-shadow:none;
  }
  .layout{
    display:flex;gap:26px;flex-wrap:wrap;justify-content:center;
    align-items:flex-start;width:100%;max-width:980px;
  }

  /* ====== PLAYER WINDOW - closer to real WMP ====== */
  .player{
    width:430px;max-width:94vw;
    border:1px solid #7a1850;border-radius:8px 8px 0 0;
    background:var(--chrome);
    box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,
               0 24px 60px -16px rgba(0,0,0,.8);
    overflow:hidden;
  }
  /* glossy XP-style titlebar: highlight strip on top, rounded */
  .titlebar{
    position:relative;display:flex;align-items:center;gap:7px;
    height:30px;padding:0 6px 0 7px;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.85) 0%,
        var(--accent-light) 9%,
        var(--accent) 48%,
        var(--accent-deep) 92%,
        var(--accent) 100%);
    border-bottom:1px solid var(--accent-deep);
  }
  .titlebar::after{ /* top gloss highlight */
    content:"";position:absolute;left:0;right:0;top:0;height:9px;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0));
    pointer-events:none;
  }
  .titlebar .orb{
    width:16px;height:16px;border-radius:50%;flex:none;z-index:1;
    background:radial-gradient(circle at 34% 30%,#fff,#9fe6ff 38%,#0a84c8 88%);
    box-shadow:0 0 3px rgba(255,255,255,.8);
  }
  .titlebar .title{
    font-family:'Tahoma','Tinos',sans-serif;font-weight:700;font-size:13px;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);z-index:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .winbtns{display:flex;gap:3px;z-index:1;}
  .winbtns span{
    width:22px;height:21px;border:1px solid #fff;border-radius:4px;
    background:linear-gradient(180deg,#fff 0%,var(--accent-light) 55%,var(--accent) 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Tahoma',sans-serif;font-size:11px;font-weight:700;color:var(--accent-deep);
    box-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  .winbtns span.x{
    background:linear-gradient(180deg,#fff 0%,#ff9ec6 55%,var(--accent-deep) 100%);
  }
  .menubar{
    display:flex;gap:2px;padding:2px 6px;
    background:linear-gradient(180deg,#ffffff,var(--chrome));
    border-bottom:1px solid rgba(168,34,106,.4);
    font-family:'Tahoma','Tinos',sans-serif;font-size:12px;color:var(--ink);
  }
  .menubar span{padding:2px 8px;border-radius:3px;}
  .menubar span:hover{background:var(--accent);color:#fff;}

  /* the video display area with inset bevel like WMP */
  .screen-wrap{padding:8px 8px 0;background:linear-gradient(180deg,var(--accent-light),var(--chrome));}
  .screen{
    position:relative;width:100%;aspect-ratio:4/3.3;
    background:#000;overflow:hidden;
    border:1px solid #5a0f38;
    box-shadow:0 0 0 2px var(--accent-deep), inset 0 0 14px rgba(0,0,0,.9);
  }
  video,canvas#snap{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;transform:scaleX(-1);
  }
  canvas#snap{display:none;z-index:5;background:#000;transform:none;}

  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(20,8,4,.62) 100%);
    mix-blend-mode:multiply;
  }
  .leak{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    mix-blend-mode:screen;opacity:.35;
    background:
      radial-gradient(circle at 90% 12%, rgba(255,170,90,.55), transparent 32%),
      radial-gradient(circle at 8% 95%, rgba(255,90,140,.4), transparent 38%);
  }
  /* flash bloom shown live above video */
  .flashglow{
    position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
    transition:opacity .15s;
    background:
      radial-gradient(ellipse at 50% 36%, rgba(255,255,248,.6), transparent 52%),
      radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.5) 100%);
  }
  .flashglow.on{opacity:1;}
  .grain{
    position:absolute;inset:0;pointer-events:none;z-index:6;
    opacity:.3;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .scan{
    position:absolute;inset:0;pointer-events:none;z-index:6;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5;
  }
  .burst{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none;}
  .burst.fire{animation:burst .5s ease-out;}
  @keyframes burst{0%{opacity:0;}10%{opacity:1;}100%{opacity:0;}}

  .caption{
    position:absolute;left:0;right:0;bottom:14px;z-index:8;text-align:center;
    font-size:26px;letter-spacing:1px;color:#ffe9b8;padding:0 14px;
    text-shadow:2px 2px 0 rgba(0,0,0,.85);
  }
  .recdot{
    position:absolute;left:12px;top:10px;z-index:9;display:none;
    font-family:'VT323',monospace;font-size:18px;color:#fff;
    align-items:center;gap:6px;text-shadow:1px 1px 0 #000;
  }
  .recdot.on{display:flex;}
  .recdot b{width:11px;height:11px;border-radius:50%;background:#ff2d2d;
    animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* WMP-style status row */
  .statusbar{
    padding:3px 10px;background:#1a0010;color:var(--accent-light);
    font-family:'Tahoma',monospace;font-size:12px;letter-spacing:.5px;
    border-top:1px solid var(--accent-deep);
  }
  /* transport - rounded inset console like WMP */
  .transport{
    display:flex;align-items:center;gap:9px;padding:9px 12px 13px;
    background:linear-gradient(180deg,#ffffff,var(--accent-light) 40%,var(--accent) 100%);
  }
  .tbtn{
    border:1px solid var(--accent-deep);border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#fff,var(--glass) 52%,var(--accent));
    color:var(--accent-deep);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s;
    box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 1px 2px rgba(255,255,255,.9);
  }
  .tbtn:active{transform:scale(.92);}
  .tbtn.big{width:50px;height:50px;font-size:20px;}
  .tbtn.sm{width:32px;height:32px;font-size:13px;}
  .tbtn.rec{width:40px;height:40px;font-size:15px;color:#c00;}
  .tbtn.rec.recording{background:radial-gradient(circle at 34% 28%,#ff8a8a,#ff2d2d);color:#fff;}
  .seek{
    flex:1;height:9px;border-radius:5px;
    background:linear-gradient(180deg,var(--accent-deep),var(--accent));
    border:1px solid #fff;position:relative;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  }
  .seek::after{
    content:"";position:absolute;top:-5px;left:30%;width:9px;height:18px;
    border-radius:3px;background:linear-gradient(180deg,#fff,var(--glass));
    border:1px solid var(--accent-deep);
  }

  /* ====== PANEL ====== */
  .panel{
    width:300px;max-width:94vw;border:2px solid var(--accent-deep);
    border-radius:9px;background:var(--chrome);color:var(--ink);
    box-shadow:0 18px 50px -16px rgba(0,0,0,.8);overflow:hidden;
  }
  .panel h2{
    font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;
    background:linear-gradient(180deg,var(--accent),var(--accent-deep));
    color:var(--titlebar-text);padding:7px 12px;text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .panel .body{padding:14px 14px 18px;display:flex;flex-direction:column;gap:14px;}
  .field label{
    display:block;font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:1px;color:var(--accent-deep);margin-bottom:5px;
  }
  .field input[type=text],.field select{
    width:100%;padding:7px 9px;border:1px solid var(--accent-deep);
    border-radius:4px;background:#fff;font-family:'Tinos',serif;
    font-size:15px;color:var(--ink);
  }
  .field input[type=range]{width:100%;accent-color:var(--accent);}
  .inline2{display:flex;gap:8px;}
  .inline2>div{flex:1;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{
    width:30px;height:30px;border-radius:50%;cursor:pointer;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .1s;
  }
  .swatch:hover{transform:scale(1.15);}
  .swatch.active{outline:2px solid var(--ink);outline-offset:2px;}
  .custom-color{display:flex;align-items:center;gap:8px;}
  .custom-color input[type=color]{
    width:42px;height:30px;border:1px solid var(--accent-deep);
    border-radius:4px;background:#fff;cursor:pointer;padding:2px;
  }
  .effects{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'VT323',monospace;font-size:15px;padding:3px 10px;
    border-radius:14px;cursor:pointer;border:1px solid var(--accent-deep);
    background:#fff;color:var(--accent-deep);transition:.12s;
  }
  .chip.active{background:var(--accent);color:#fff;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent-deep);font-weight:700;}
  .actbtn{
    width:100%;padding:9px;font-family:'VT323',monospace;font-size:18px;
    letter-spacing:1px;border:1px solid var(--accent-deep);border-radius:5px;
    background:linear-gradient(180deg,#fff,var(--glass));
    color:var(--accent-deep);cursor:pointer;transition:.12s;
  }
  .actbtn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:#fff;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .actbtn{font-size:15px;}
  .hint{font-size:11px;color:#9a4a72;line-height:1.4;}
  .swatch.cap{width:26px;height:26px;}
  @media(max-width:560px){
    .page-title{font-size:24px;}
  }
</style>
</head>
<body>

  <div class="page-title">
    &#9733; Y2K MEDIA PLAYER CAM &#9733;
    <small>now playing&nbsp;:&nbsp;you</small>
  </div>

  <div class="layout">

    <!-- ===== PLAYER ===== -->
    <div class="player" id="player">
      <div class="titlebar">
        <div class="orb"></div>
        <div class="title" id="winTitle">Windows Media Player</div>
        <div class="winbtns"><span>&#8211;</span><span>&#9633;</span><span class="x">&#10005;</span></div>
      </div>
      <div class="menubar">
        <span>File</span><span>View</span><span>Play</span><span>Tools</span><span>Help</span>
      </div>

      <div class="screen-wrap">
        <div class="screen" id="screen">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="snap"></canvas>
          <div class="vignette" id="vignetteEl"></div>
          <div class="leak" id="leakEl"></div>
          <div class="flashglow" id="flashGlow"></div>
          <div class="scan" id="scanEl"></div>
          <div class="grain" id="grainEl"></div>
          <div class="burst" id="burst"></div>
          <div class="recdot" id="recdot"><b></b>REC</div>
          <div class="caption" id="caption">say cheese</div>
        </div>
      </div>

      <div class="statusbar" id="status">Ready</div>

      <div class="transport">
        <button class="tbtn big" id="shoot" title="Take photo">&#9658;</button>
        <button class="tbtn rec" id="record" title="Record video">&#9679;</button>
        <button class="tbtn sm" id="retake" title="Back to live">&#9632;</button>
        <button class="tbtn sm" title="Previous">&#9198;</button>
        <div class="seek"></div>
      </div>
    </div>

    <!-- ===== PANEL ===== -->
    <div class="panel">
      <h2>&#9998; customize</h2>
      <div class="body">

        <div class="field">
          <label>Window title</label>
          <input type="text" id="titleInput" value="Windows Media Player" maxlength="40">
        </div>

        <div class="field">
          <label>Caption text</label>
          <input type="text" id="captionInput" value="say cheese" maxlength="40">
        </div>
        <div class="inline2">
          <div class="field">
            <label>Caption font</label>
            <select id="capFont">
              <option value="'VT323',monospace">Pixel</option>
              <option value="'Press Start 2P',monospace">Arcade</option>
              <option value="'Pacifico',cursive">Script</option>
              <option value="'Bebas Neue',sans-serif">Bold</option>
              <option value="'Courier Prime',monospace">Typewriter</option>
              <option value="'Tinos',serif">Serif</option>
            </select>
          </div>
          <div class="field">
            <label>Size <span id="capSizeVal" style="float:right">26</span></label>
            <input type="range" id="capSize" min="14" max="52" value="26">
          </div>
        </div>
        <div class="field">
          <label>Caption color</label>
          <div class="swatches" id="capSwatches"></div>
          <div class="custom-color" style="margin-top:6px">
            <input type="color" id="capColor" value="#ffe9b8">
            <span class="hint">pick any caption color</span>
          </div>
        </div>

        <div class="field">
          <label>Theme color</label>
          <div class="swatches" id="swatches"></div>
          <div class="custom-color">
            <input type="color" id="colorPick" value="#e8489a">
            <span class="hint">pick any shade</span>
          </div>
        </div>

        <div class="field">
          <label>Camera model</label>
          <div class="effects" id="effects"></div>
        </div>

        <div class="field">
          <label class="toggle-row"><input type="checkbox" id="flashTog"> &#9889; flash</label>
          <label class="toggle-row" style="margin-top:6px"><input type="checkbox" id="leakTog" checked> light leaks</label>
        </div>

        <div class="field">
          <label>Warmth <span id="warmthVal" style="float:right">100%</span></label>
          <input type="range" id="warmth" min="50" max="160" value="100">
        </div>
        <div class="field">
          <label>Fade / wash <span id="fadeVal" style="float:right">45%</span></label>
          <input type="range" id="fade" min="0" max="100" value="45">
        </div>
        <div class="field">
          <label>Grain <span id="grainVal" style="float:right">30%</span></label>
          <input type="range" id="grainAmt" min="0" max="70" value="30">
        </div>
        <div class="field">
          <label>Soft focus <span id="blurVal" style="float:right">0.6px</span></label>
          <input type="range" id="blurAmt" min="0" max="25" value="6">
        </div>

        <button class="actbtn primary" id="shoot2">&#9733; TAKE PHOTO &#9733;</button>
        <div class="btn-row">
          <button class="actbtn" id="download">&#8595; save photo</button>
          <button class="actbtn" id="retake2">&#8634; retake</button>
        </div>

        <p class="hint">Allow camera access when asked. Everything runs on your device. Camera needs an https:// or localhost address to work.</p>
      </div>
    </div>

  </div>

<script>
(function(){
  const video=document.getElementById('video');
  const snap=document.getElementById('snap');
  const ctx=snap.getContext('2d');
  const status=document.getElementById('status');
  const caption=document.getElementById('caption');
  const screen=document.getElementById('screen');
  const player=document.getElementById('player');
  const vignetteEl=document.getElementById('vignetteEl');
  const grainEl=document.getElementById('grainEl');
  const leakEl=document.getElementById('leakEl');
  const scanEl=document.getElementById('scanEl');
  const flashGlow=document.getElementById('flashGlow');
  const burst=document.getElementById('burst');
  const recdot=document.getElementById('recdot');
  const winTitle=document.getElementById('winTitle');
  const root=document.documentElement;

  const fx={
    warmth:100, fade:45, grain:30, blur:0.6,
    effect:'iphone6s', leaks:true, flash:false, captured:false,
    capFont:"'VT323',monospace", capSize:26, capColor:'#ffe9b8'
  };

  const presets={
    iphone6s: ()=>`saturate(${fx.warmth*1.1}%) contrast(102%) brightness(1.04) hue-rotate(-3deg) blur(${fx.blur}px)`,
    nokia:    ()=>`saturate(${fx.warmth*0.85}%) contrast(120%) brightness(1.0) hue-rotate(8deg) blur(${fx.blur+0.6}px)`,
    polaroid: ()=>`saturate(${fx.warmth*0.7}%) contrast(80%) brightness(1.14) sepia(.22) blur(${fx.blur}px)`,
    camcorder:()=>`saturate(${fx.warmth*1.15}%) contrast(108%) brightness(1.02) hue-rotate(4deg) blur(${fx.blur+0.5}px)`,
    disposable:()=>`saturate(${fx.warmth*0.78}%) contrast(90%) brightness(1.07) sepia(.3) hue-rotate(-10deg) blur(${fx.blur}px)`,
    vhs:      ()=>`saturate(${fx.warmth*1.3}%) contrast(112%) brightness(1.0) hue-rotate(-6deg) blur(${fx.blur+0.8}px)`
  };
  const modelTint={
    iphone6s:null, nokia:'rgba(120,140,90,0.12)', polaroid:'rgba(255,225,180,0.14)',
    camcorder:'rgba(90,120,255,0.10)', disposable:'rgba(255,180,120,0.13)', vhs:'rgba(255,80,160,0.10)'
  };

  function capCss(){
    return `${fx.capSize}px ${fx.capFont}`;
  }
  function applyLook(){
    const f=(presets[fx.effect]||presets.iphone6s)();
    video.style.filter=f;
    snap.style.filter='none';
    vignetteEl.style.opacity=(0.4+fx.fade/100*0.6).toFixed(2);
    grainEl.style.opacity=(fx.grain/100).toFixed(2);
    leakEl.style.display=fx.leaks?'block':'none';
    flashGlow.classList.toggle('on',fx.flash);
    caption.style.font=capCss();
    caption.style.color=fx.capColor;
  }

  /* camera */
  let stream=null;
  async function startCam(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:true
      });
      video.srcObject=stream;
      status.textContent='Ready  -  live';
    }catch(err){
      status.textContent='No camera - check permissions';
      caption.textContent='camera access needed';
    }
  }
  startCam();

  /* ---- FLASH: real pixel processing - blow highlights, lift, harsh ---- */
  function applyFlash(c,W,H){
    // 1. pixel-level: push brights toward white, add overall lift, boost contrast
    const id=c.getImageData(0,0,W,H), d=id.data;
    for(let i=0;i<d.length;i+=4){
      for(let k=0;k<3;k++){
        let v=d[i+k];
        v=v*1.28+26;                       // exposure lift
        const lum=v/255;
        v+=(lum*lum)*70;                   // highlight bloom toward white
        v=(v-128)*1.12+128;                // harsh contrast
        d[i+k]=v<0?0:v>255?255:v;
      }
    }
    c.putImageData(id,0,0);
    // 2. bright bloom from flash position
    const fl=c.createRadialGradient(W/2,H*0.34,0, W/2,H*0.34,H*0.95);
    fl.addColorStop(0,'rgba(255,255,250,0.5)');
    fl.addColorStop(0.45,'rgba(255,255,250,0.12)');
    fl.addColorStop(1,'rgba(255,255,250,0)');
    c.fillStyle=fl; c.fillRect(0,0,W,H);
    // 3. hard dark corner falloff (flash can't reach the edges)
    const fd=c.createRadialGradient(W/2,H*0.38,H*0.28, W/2,H*0.38,H*1.0);
    fd.addColorStop(0,'rgba(0,0,0,0)');
    fd.addColorStop(1,'rgba(0,0,0,0.6)');
    c.fillStyle=fd; c.fillRect(0,0,W,H);
  }

  function paintEffects(c,W,H){
    const tint=modelTint[fx.effect];
    if(tint){ c.fillStyle=tint; c.fillRect(0,0,W,H); }
    const g=c.createRadialGradient(W/2,H*0.45,H*0.2, W/2,H*0.45,H*0.85);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(20,8,4,${(0.4+fx.fade/100*0.45).toFixed(2)})`);
    c.fillStyle=g; c.fillRect(0,0,W,H);
    if(fx.leaks){
      const l1=c.createRadialGradient(W*0.9,H*0.12,0, W*0.9,H*0.12,W*0.4);
      l1.addColorStop(0,'rgba(255,170,90,0.45)'); l1.addColorStop(1,'rgba(255,170,90,0)');
      c.fillStyle=l1; c.fillRect(0,0,W,H);
      const l2=c.createRadialGradient(W*0.08,H*0.95,0, W*0.08,H*0.95,W*0.45);
      l2.addColorStop(0,'rgba(255,90,140,0.35)'); l2.addColorStop(1,'rgba(255,90,140,0)');
      c.fillStyle=l2; c.fillRect(0,0,W,H);
    }
    c.fillStyle='rgba(0,0,0,0.15)';
    for(let y=0;y<H;y+=3){ c.fillRect(0,y,W,1); }
  }
  function paintGrain(c,W,H){
    if(fx.grain<=0)return;
    const amt=fx.grain/100;
    const id=c.getImageData(0,0,W,H), d=id.data;
    for(let i=0;i<d.length;i+=4){
      const n=(Math.random()-0.5)*120*amt;
      d[i]+=n; d[i+1]+=n; d[i+2]+=n;
    }
    c.putImageData(id,0,0);
  }

  function drawCaption(c,W,H){
    if(!caption.textContent.trim())return;
    const px=Math.round(fx.capSize/26 * (W/17));
    c.font=`${px}px ${fx.capFont}`;
    c.textAlign='center'; c.textBaseline='alphabetic';
    c.fillStyle=fx.capColor;
    c.shadowColor='rgba(0,0,0,.85)';
    c.shadowOffsetX=px*0.07; c.shadowOffsetY=px*0.07;
    c.fillText(caption.textContent,W/2,H-H/16);
    c.shadowColor='transparent'; c.shadowOffsetX=0; c.shadowOffsetY=0;
  }

  /* ---- TAKE PHOTO ---- */
  function renderPhoto(){
    snap.width=video.videoWidth||1280;
    snap.height=video.videoHeight||960;
    const W=snap.width,H=snap.height;
    ctx.save();
    ctx.translate(W,0); ctx.scale(-1,1);
    ctx.filter=(presets[fx.effect]||presets.iphone6s)();
    ctx.drawImage(video,0,0,W,H);
    ctx.restore();
    ctx.filter='none';
    // FLASH applied right after the frame, before other layers, so it shows
    if(fx.flash) applyFlash(ctx,W,H);
    paintEffects(ctx,W,H);
    paintGrain(ctx,W,H);
    drawCaption(ctx,W,H);
  }
  function showCaptured(on){
    [vignetteEl,leakEl,grainEl,scanEl,flashGlow,caption].forEach(el=>{
      el.style.visibility=on?'hidden':'visible';
    });
    if(!on) applyLook();
  }
  function takePhoto(){
    if(!video.videoWidth){status.textContent='Camera not ready...';return;}
    burst.classList.remove('fire'); void burst.offsetWidth;
    if(fx.flash) burst.classList.add('fire');
    renderPhoto();
    snap.style.display='block';
    showCaptured(true);
    fx.captured=true;
    status.textContent='Photo captured  -  press save';
  }
  function retake(){
    snap.style.display='none';
    showCaptured(false);
    fx.captured=false;
    status.textContent='Ready  -  live';
  }

  /* ---- DOWNLOAD : composite whole WMP window ---- */
  function download(){
    if(!fx.captured) takePhoto();
    status.textContent='Building frame...';
    const SCALE=2;
    const cw=screen.clientWidth;
    const titleH=30,menuH=24,padTop=8,statusH=22,transportH=68,sidePad=8;
    const frameW=cw+sidePad*2;
    const frameH=titleH+menuH+padTop+screen.clientHeight+statusH+transportH;
    const out=document.createElement('canvas');
    out.width=frameW*SCALE; out.height=frameH*SCALE;
    const o=out.getContext('2d');
    o.scale(SCALE,SCALE);

    const cs=getComputedStyle(root);
    const accent=cs.getPropertyValue('--accent').trim()||'#e8489a';
    const accentDeep=cs.getPropertyValue('--accent-deep').trim()||'#a8226a';
    const accentLight=cs.getPropertyValue('--accent-light').trim()||'#ffc6e4';
    const chrome=cs.getPropertyValue('--chrome').trim()||'#f4d4e4';

    o.fillStyle=chrome; o.fillRect(0,0,frameW,frameH);

    // glossy titlebar
    let grad=o.createLinearGradient(0,0,0,titleH);
    grad.addColorStop(0,'#ffffff'); grad.addColorStop(.09,accentLight);
    grad.addColorStop(.48,accent); grad.addColorStop(1,accentDeep);
    o.fillStyle=grad; o.fillRect(0,0,frameW,titleH);
    let gloss=o.createLinearGradient(0,0,0,9);
    gloss.addColorStop(0,'rgba(255,255,255,.7)'); gloss.addColorStop(1,'rgba(255,255,255,0)');
    o.fillStyle=gloss; o.fillRect(0,0,frameW,9);
    // orb
    o.beginPath(); o.arc(15,titleH/2,8,0,7);
    o.fillStyle='#9fe6ff'; o.fill();
    o.beginPath(); o.arc(13,titleH/2-2,3,0,7); o.fillStyle='#fff'; o.fill();
    // title
    o.fillStyle='#fff'; o.font='bold 13px Tahoma, sans-serif';
    o.textAlign='left'; o.textBaseline='middle';
    o.fillText(winTitle.textContent,30,titleH/2+1);
    // window buttons
    ['#8211;','x'].forEach(()=>{});
    for(let i=0;i<3;i++){
      const bx=frameW-7-(3-i)*25;
      o.fillStyle='#fff';
      o.fillRect(bx,titleH/2-10,22,21);
    }

    // menubar
    o.fillStyle='#ffffff'; o.fillRect(0,titleH,frameW,menuH);
    o.fillStyle='#3a0d24'; o.font='12px Tahoma, sans-serif';
    o.textBaseline='middle';
    let mx=12; ['File','View','Play','Tools','Help'].forEach(m=>{
      o.fillText(m,mx,titleH+menuH/2); mx+=o.measureText(m).width+16;
    });

    // screen
    const screenY=titleH+menuH+padTop;
    o.fillStyle=accentDeep; o.fillRect(sidePad-2,screenY-2,cw+4,screen.clientHeight+4);
    o.fillStyle='#000'; o.fillRect(sidePad,screenY,cw,screen.clientHeight);
    o.drawImage(snap,sidePad,screenY,cw,screen.clientHeight);

    // statusbar
    const statusY=screenY+screen.clientHeight;
    o.fillStyle='#1a0010'; o.fillRect(0,statusY,frameW,statusH);
    o.fillStyle=accentLight; o.font='12px Tahoma, monospace';
    o.textAlign='left'; o.textBaseline='middle';
    o.fillText('Ready',12,statusY+statusH/2);

    // transport
    const transY=statusY+statusH;
    let tg=o.createLinearGradient(0,transY,0,transY+transportH);
    tg.addColorStop(0,'#ffffff'); tg.addColorStop(.4,accentLight); tg.addColorStop(1,accent);
    o.fillStyle=tg; o.fillRect(0,transY,frameW,transportH);
    o.beginPath(); o.arc(37,transY+34,24,0,7);
    o.fillStyle='#fff'; o.fill();
    o.strokeStyle=accentDeep; o.lineWidth=1.5; o.stroke();
    o.fillStyle=accentDeep; o.beginPath();
    o.moveTo(30,transY+25); o.lineTo(30,transY+43); o.lineTo(47,transY+34); o.fill();
    o.fillStyle=accentDeep;
    o.fillRect(105,transY+30,frameW-125,9);

    const a=document.createElement('a');
    a.download='y2k-cam-'+Date.now()+'.png';
    a.href=out.toDataURL('image/png');
    a.click();
    status.textContent='Saved with frame  <3';
  }

  /* ---- VIDEO RECORDING ---- */
  let recorder=null,chunks=[],recording=false,rafId=null;
  const recordBtn=document.getElementById('record');
  function startRec(){
    if(!stream){status.textContent='No camera stream';return;}
    const rec=document.createElement('canvas');
    rec.width=video.videoWidth||1280; rec.height=video.videoHeight||960;
    const rc=rec.getContext('2d');
    function draw(){
      rc.save();
      rc.translate(rec.width,0); rc.scale(-1,1);
      rc.filter=(presets[fx.effect]||presets.iphone6s)();
      rc.drawImage(video,0,0,rec.width,rec.height);
      rc.restore(); rc.filter='none';
      if(fx.flash) applyFlash(rc,rec.width,rec.height);
      paintEffects(rc,rec.width,rec.height);
      rafId=requestAnimationFrame(draw);
    }
    draw();
    const vs=rec.captureStream(30);
    const at=stream.getAudioTracks()[0];
    if(at) vs.addTrack(at);
    chunks=[];
    try{ recorder=new MediaRecorder(vs,{mimeType:'video/webm'}); }
    catch(e){ status.textContent='Recording not supported'; cancelAnimationFrame(rafId); return; }
    recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      cancelAnimationFrame(rafId);
      const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a');
      a.download='y2k-cam-'+Date.now()+'.webm';
      a.href=URL.createObjectURL(blob); a.click();
      status.textContent='Video saved  <3';
    };
    recorder.start();
    recording=true;
    recordBtn.classList.add('recording');
    recdot.classList.add('on');
    status.textContent='Recording...  (tap red dot to stop)';
  }
  function stopRec(){
    if(recorder&&recording){
      recorder.stop(); recording=false;
      recordBtn.classList.remove('recording');
      recdot.classList.remove('on');
    }
  }
  recordBtn.onclick=()=> recording?stopRec():startRec();

  /* wiring */
  document.getElementById('shoot').onclick=takePhoto;
  document.getElementById('shoot2').onclick=takePhoto;
  document.getElementById('retake').onclick=retake;
  document.getElementById('retake2').onclick=retake;
  document.getElementById('download').onclick=download;

  document.getElementById('titleInput').oninput=e=>{
    winTitle.textContent=e.target.value||' ';
  };
  document.getElementById('captionInput').oninput=e=>{
    caption.textContent=e.target.value;
  };

  /* caption font / size / color */
  document.getElementById('capFont').onchange=e=>{
    fx.capFont=e.target.value; applyLook();
  };
  const capSize=document.getElementById('capSize');
  capSize.oninput=()=>{
    fx.capSize=+capSize.value;
    document.getElementById('capSizeVal').textContent=capSize.value;
    applyLook();
  };
  const capColors=['#ffe9b8','#ffffff','#ff5d8f','#ff2d2d','#ffd400','#7cf8ff','#9b5de5','#000000'];
  const capSwBox=document.getElementById('capSwatches');
  capColors.forEach((hex,i)=>{
    const s=document.createElement('div');
    s.className='swatch cap'+(i===0?' active':'');
    s.style.background=hex;
    s.onclick=()=>{
      fx.capColor=hex;
      document.getElementById('capColor').value=hex;
      [...capSwBox.children].forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
      applyLook();
    };
    capSwBox.appendChild(s);
  });
  document.getElementById('capColor').oninput=e=>{
    fx.capColor=e.target.value;
    [...capSwBox.children].forEach(x=>x.classList.remove('active'));
    applyLook();
  };

  function bindSlider(id,key,fmt,labelId){
    const el=document.getElementById(id);
    el.oninput=()=>{
      fx[key]=key==='blur'?(+el.value/10):+el.value;
      document.getElementById(labelId).textContent=fmt(el.value);
      applyLook();
    };
  }
  bindSlider('warmth','warmth',v=>v+'%','warmthVal');
  bindSlider('fade','fade',v=>v+'%','fadeVal');
  bindSlider('grainAmt','grain',v=>v+'%','grainVal');
  bindSlider('blurAmt','blur',v=>(v/10).toFixed(1)+'px','blurVal');

  document.getElementById('flashTog').onchange=e=>{fx.flash=e.target.checked;applyLook();};
  document.getElementById('leakTog').onchange=e=>{fx.leaks=e.target.checked;applyLook();};

  /* camera model chips */
  const effectList=[
    ['iphone6s','iPhone 6s'],['nokia','Nokia'],['polaroid','Polaroid'],
    ['camcorder','Camcorder'],['disposable','Disposable'],['vhs','VHS']
  ];
  const effectsBox=document.getElementById('effects');
  effectList.forEach(([key,label])=>{
    const c=document.createElement('div');
    c.className='chip'+(key===fx.effect?' active':'');
    c.textContent=label;
    c.onclick=()=>{
      fx.effect=key;
      [...effectsBox.children].forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      applyLook();
    };
    effectsBox.appendChild(c);
  });

  /* theme color */
  function setTheme(hex){
    const c=hex.replace('#','');
    const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
    const mix=(a,t)=>Math.round(a+(t-a)*0.55);
    root.style.setProperty('--accent',hex);
    root.style.setProperty('--accent-deep',`rgb(${Math.round(r*.6)},${Math.round(g*.6)},${Math.round(b*.6)})`);
    root.style.setProperty('--accent-light',`rgb(${mix(r,255)},${mix(g,255)},${mix(b,255)})`);
    root.style.setProperty('--chrome',`rgb(${Math.round(r+(255-r)*.85)},${Math.round(g+(255-g)*.85)},${Math.round(b+(255-b)*.85)})`);
    root.style.setProperty('--glass',`rgb(${mix(r,255)},${mix(g,255)},${mix(b,255)})`);
  }
  const swatchColors=['#e8489a','#9b5de5','#00bbf9','#43c59e','#ff8c42','#ff5d8f','#3a3a55'];
  const swBox=document.getElementById('swatches');
  swatchColors.forEach((hex,i)=>{
    const s=document.createElement('div');
    s.className='swatch'+(i===0?' active':'');
    s.style.background=hex;
    s.onclick=()=>{
      setTheme(hex);
      document.getElementById('colorPick').value=hex;
      [...swBox.children].forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
    };
    swBox.appendChild(s);
  });
  document.getElementById('colorPick').oninput=e=>{
    setTheme(e.target.value);
    [...swBox.children].forEach(x=>x.classList.remove('active'));
  };

  applyLook();
})();
</script>
</body>
</html>

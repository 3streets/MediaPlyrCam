<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Y2K Media Player Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --accent:#e8489a; --accent-deep:#a8226a; --accent-light:#ffc6e4;
    --chrome:#ffe3f1; --glass:#ffd0e6; --ink:#3a0d24; --titlebar-text:#fff7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tinos',serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.05), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(232,72,154,.12), transparent 45%),
      #07060a;
    color:#fff;min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:34px 16px 60px;gap:26px;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.45;
  }
  .page-title{
    font-family:'VT323',monospace;font-size:30px;letter-spacing:2px;
    color:var(--accent-light);text-align:center;
    text-shadow:1px 1px 0 var(--accent-deep);
  }
  .page-title small{
    display:block;font-size:14px;letter-spacing:5px;color:#b98;
    margin-top:2px;text-shadow:none;
  }
  .layout{
    display:flex;gap:26px;flex-wrap:wrap;justify-content:center;
    align-items:flex-start;width:100%;max-width:980px;
  }

  /* ---------- player window ---------- */
  .player{
    width:430px;max-width:94vw;
    border:2px solid var(--accent-deep);border-radius:9px 9px 5px 5px;
    background:var(--chrome);
    box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,
               0 24px 60px -16px rgba(0,0,0,.8);
    overflow:hidden;
  }
  .titlebar{
    display:flex;align-items:center;gap:8px;padding:6px 8px;
    background:linear-gradient(180deg,var(--accent-light) 0%,var(--accent) 38%,var(--accent-deep) 100%);
    border-bottom:1px solid var(--accent-deep);
  }
  .titlebar .orb{
    width:18px;height:18px;border-radius:50%;flex:none;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent-light) 40%,var(--accent-deep));
  }
  .titlebar .title{
    font-family:'Tinos',serif;font-weight:700;font-size:18px;
    color:var(--titlebar-text);text-shadow:0 1px 2px rgba(0,0,0,.4);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
  }
  .winbtns{display:flex;gap:4px;}
  .winbtns span{
    width:21px;height:19px;border:1px solid rgba(255,255,255,.7);border-radius:3px;
    background:linear-gradient(180deg,#fff,var(--glass));
    display:flex;align-items:center;justify-content:center;
    font-family:'VT323',monospace;font-size:14px;color:var(--accent-deep);
  }
  .menubar{
    display:flex;gap:18px;padding:4px 12px;
    background:linear-gradient(180deg,#fff,var(--chrome));
    border-bottom:1px solid var(--accent-light);
    font-size:15px;color:var(--ink);
  }
  .screen-wrap{padding:10px 10px 0;background:linear-gradient(180deg,var(--accent-light),var(--chrome));}
  .screen{
    position:relative;width:100%;aspect-ratio:4/3.4;
    background:#000;border:2px solid var(--accent-deep);overflow:hidden;
  }
  video,canvas#snap{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;transform:scaleX(-1);
  }
  canvas#snap{display:none;z-index:5;background:#000;}

  /* old-phone optical layers */
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(20,8,4,.62) 100%);
    mix-blend-mode:multiply;
  }
  .leak{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    mix-blend-mode:screen;opacity:.35;
    background:
      radial-gradient(circle at 90% 12%, rgba(255,170,90,.55), transparent 32%),
      radial-gradient(circle at 8% 95%, rgba(255,90,140,.4), transparent 38%);
  }
  .grain{
    position:absolute;inset:0;pointer-events:none;z-index:6;
    opacity:.3;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .softfocus{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    backdrop-filter:blur(.6px);
  }
  .caption{
    position:absolute;left:0;right:0;bottom:10px;z-index:7;text-align:center;
    font-family:'VT323',monospace;font-size:24px;letter-spacing:1px;
    color:#ffe9b8;padding:0 14px;
    text-shadow:1px 1px 0 rgba(0,0,0,.85);
  }
  .datestamp{
    position:absolute;right:12px;bottom:10px;z-index:7;
    font-family:'VT323',monospace;font-size:19px;
    color:#ff9a3c;text-shadow:0 0 3px rgba(0,0,0,.7);
    letter-spacing:1px;
  }
  .recdot{
    position:absolute;left:12px;top:10px;z-index:8;display:none;
    font-family:'VT323',monospace;font-size:18px;color:#fff;
    align-items:center;gap:6px;
  }
  .recdot.on{display:flex;}
  .recdot b{
    width:11px;height:11px;border-radius:50%;background:#ff2d2d;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .statusbar{
    padding:4px 12px;background:#000;color:var(--accent-light);
    font-family:'VT323',monospace;font-size:18px;letter-spacing:1px;
    border-top:1px solid var(--accent-deep);
  }
  .transport{
    display:flex;align-items:center;gap:9px;padding:10px 12px 14px;
    background:linear-gradient(180deg,var(--chrome),var(--accent-light));
  }
  .tbtn{
    border:1px solid var(--accent-deep);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--glass) 55%,var(--accent));
    color:var(--accent-deep);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s;box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .tbtn:active{transform:scale(.92);}
  .tbtn.big{width:54px;height:54px;font-size:22px;}
  .tbtn.sm{width:34px;height:34px;font-size:14px;}
  .tbtn.rec{width:42px;height:42px;font-size:16px;color:#c00;}
  .tbtn.rec.recording{background:radial-gradient(circle at 35% 30%,#ff8a8a,#ff2d2d);color:#fff;}
  .seek{
    flex:1;height:10px;border-radius:6px;
    background:linear-gradient(180deg,var(--accent-deep),var(--accent));
    border:1px solid #fff;position:relative;
  }
  .seek::after{
    content:"";position:absolute;top:-4px;left:30%;width:10px;height:18px;
    border-radius:3px;background:linear-gradient(180deg,#fff,var(--glass));
    border:1px solid var(--accent-deep);
  }

  /* ---------- panel ---------- */
  .panel{
    width:300px;max-width:94vw;border:2px solid var(--accent-deep);
    border-radius:9px;background:var(--chrome);color:var(--ink);
    box-shadow:0 18px 50px -16px rgba(0,0,0,.8);overflow:hidden;
  }
  .panel h2{
    font-family:'VT323',monospace;font-size:20px;letter-spacing:1px;
    background:linear-gradient(180deg,var(--accent),var(--accent-deep));
    color:var(--titlebar-text);padding:7px 12px;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .panel .body{padding:14px 14px 18px;display:flex;flex-direction:column;gap:15px;}
  .field label{
    display:block;font-size:13px;font-weight:700;text-transform:uppercase;
    letter-spacing:1px;color:var(--accent-deep);margin-bottom:5px;
  }
  .field input[type=text]{
    width:100%;padding:7px 9px;border:1px solid var(--accent-deep);
    border-radius:4px;background:#fff;font-family:'Tinos',serif;
    font-size:15px;color:var(--ink);
  }
  .field input[type=range]{width:100%;accent-color:var(--accent);}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{
    width:30px;height:30px;border-radius:50%;cursor:pointer;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .1s;
  }
  .swatch:hover{transform:scale(1.15);}
  .swatch.active{outline:2px solid var(--ink);outline-offset:2px;}
  .custom-color{display:flex;align-items:center;gap:8px;}
  .custom-color input[type=color]{
    width:42px;height:30px;border:1px solid var(--accent-deep);
    border-radius:4px;background:#fff;cursor:pointer;padding:2px;
  }
  .effects{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-family:'VT323',monospace;font-size:15px;padding:3px 10px;
    border-radius:14px;cursor:pointer;border:1px solid var(--accent-deep);
    background:#fff;color:var(--accent-deep);transition:.12s;
  }
  .chip.active{background:var(--accent);color:#fff;}
  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent-deep);font-weight:700;}
  .actbtn{
    width:100%;padding:9px;font-family:'VT323',monospace;font-size:18px;
    letter-spacing:1px;border:1px solid var(--accent-deep);border-radius:5px;
    background:linear-gradient(180deg,#fff,var(--glass));
    color:var(--accent-deep);cursor:pointer;transition:.12s;
  }
  .actbtn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-deep));color:#fff;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .actbtn{font-size:15px;}
  .hint{font-size:11px;color:#9a4a72;line-height:1.4;}
  @media(max-width:560px){
    .page-title{font-size:24px;}
    .menubar{gap:11px;font-size:13px;}
  }
</style>
</head>
<body>

  <div class="page-title">
    ★ Y2K MEDIA PLAYER CAM ★
    <small>now playing&nbsp;:&nbsp;you</small>
  </div>

  <div class="layout">

    <!-- ===== PLAYER (this whole block gets captured) ===== -->
    <div class="player" id="player">
      <div class="titlebar">
        <div class="orb"></div>
        <div class="title" id="winTitle">Windows Media Player</div>
        <div class="winbtns"><span>_</span><span>&#9634;</span><span>&#10005;</span></div>
      </div>
      <div class="menubar">
        <span>File</span><span>View</span><span>Play</span><span>Tools</span><span>Help</span>
      </div>

      <div class="screen-wrap">
        <div class="screen" id="screen">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="snap"></canvas>
          <div class="softfocus"></div>
          <div class="vignette"></div>
          <div class="leak" id="leak"></div>
          <div class="grain" id="grain"></div>
          <div class="recdot" id="recdot"><b></b>REC</div>
          <div class="caption" id="caption">say cheese</div>
          <div class="datestamp" id="datestamp"></div>
        </div>
      </div>

      <div class="statusbar" id="status">Ready</div>

      <div class="transport">
        <button class="tbtn big" id="shoot" title="Take photo">&#9658;</button>
        <button class="tbtn rec" id="record" title="Record video">&#9679;</button>
        <button class="tbtn sm" id="retake" title="Back to live">&#9632;</button>
        <button class="tbtn sm" title="Previous">&#9198;</button>
        <div class="seek"></div>
      </div>
    </div>

    <!-- ===== PANEL ===== -->
    <div class="panel">
      <h2>&#9998; customize</h2>
      <div class="body">

        <div class="field">
          <label>Window title</label>
          <input type="text" id="titleInput" value="Windows Media Player" maxlength="40">
        </div>
        <div class="field">
          <label>Caption text</label>
          <input type="text" id="captionInput" value="say cheese" maxlength="40">
        </div>

        <div class="field">
          <label>Theme color</label>
          <div class="swatches" id="swatches"></div>
          <div class="custom-color">
            <input type="color" id="colorPick" value="#e8489a">
            <span class="hint">pick any shade</span>
          </div>
        </div>

        <div class="field">
          <label>Film look</label>
          <div class="effects" id="effects"></div>
        </div>

        <div class="field">
          <label>Warmth <span id="warmthVal" style="float:right">100%</span></label>
          <input type="range" id="warmth" min="50" max="160" value="100">
        </div>
        <div class="field">
          <label>Fade / wash <span id="fadeVal" style="float:right">45%</span></label>
          <input type="range" id="fade" min="0" max="100" value="45">
        </div>
        <div class="field">
          <label>Grain <span id="grainVal" style="float:right">30%</span></label>
          <input type="range" id="grainAmt" min="0" max="70" value="30">
        </div>
        <div class="field">
          <label>Soft focus <span id="blurVal" style="float:right">0.6px</span></label>
          <input type="range" id="blurAmt" min="0" max="25" value="6">
        </div>

        <div class="field">
          <label class="toggle-row"><input type="checkbox" id="leakTog" checked> light leaks</label>
          <label class="toggle-row" style="margin-top:6px"><input type="checkbox" id="dateTog" checked> date stamp</label>
        </div>

        <button class="actbtn primary" id="shoot2">&#9733; TAKE PHOTO &#9733;</button>
        <div class="btn-row">
          <button class="actbtn" id="download">&#8595; save photo</button>
          <button class="actbtn" id="retake2">&#8634; retake</button>
        </div>

        <p class="hint">Allow camera access when asked. Everything runs on your device &mdash; nothing is uploaded. Camera needs an https:// or localhost address to work.</p>
      </div>
    </div>

  </div>

<script>
(function(){
  const video    = document.getElementById('video');
  const snap     = document.getElementById('snap');
  const ctx      = snap.getContext('2d');
  const status   = document.getElementById('status');
  const caption  = document.getElementById('caption');
  const screen   = document.getElementById('screen');
  const player   = document.getElementById('player');
  const vignetteEl = document.querySelector('.vignette');
  const grainEl  = document.getElementById('grain');
  const leakEl   = document.getElementById('leak');
  const softEl   = document.querySelector('.softfocus');
  const datestamp= document.getElementById('datestamp');
  const recdot   = document.getElementById('recdot');
  const root     = document.documentElement;

  const fx = {
    warmth:100, fade:45, grain:30, blur:0.6,
    effect:'fadedfilm', leaks:true, date:true, captured:false
  };

  /* --- old-school film looks. lower saturation, crushed-ish, warm casts.
     these mimic real expired/cheap-camera film, not neon ig filters --- */
  const presets = {
    fadedfilm:  ()=>`saturate(${fx.warmth*0.78}%) contrast(88%) brightness(1.06) sepia(.22) hue-rotate(-6deg) blur(${fx.blur}px)`,
    expired:    ()=>`saturate(${fx.warmth*0.62}%) contrast(82%) brightness(1.1) sepia(.4) hue-rotate(-18deg) blur(${fx.blur}px)`,
    camcorder:  ()=>`saturate(${fx.warmth*1.05}%) contrast(108%) brightness(1.02) hue-rotate(4deg) blur(${fx.blur+0.4}px)`,
    polaroid:   ()=>`saturate(${fx.warmth*0.7}%) contrast(80%) brightness(1.14) sepia(.18) blur(${fx.blur}px)`,
    coolwash:   ()=>`saturate(${fx.warmth*0.72}%) contrast(86%) brightness(1.08) hue-rotate(170deg) sepia(.1) blur(${fx.blur}px)`,
    sepia:      ()=>`grayscale(.3) sepia(.7) saturate(${fx.warmth*0.8}%) contrast(90%) brightness(1.05) blur(${fx.blur}px)`,
    bw:         ()=>`grayscale(1) contrast(95%) brightness(1.08) blur(${fx.blur}px)`
  };

  function applyLook(){
    const f=(presets[fx.effect]||presets.fadedfilm)();
    video.style.filter=f;
    snap.style.filter=f;
    vignetteEl.style.opacity=(0.4+fx.fade/100*0.6).toFixed(2);
    grainEl.style.opacity=(fx.grain/100).toFixed(2);
    leakEl.style.display=fx.leaks?'block':'none';
    datestamp.style.display=fx.date?'block':'none';
    softEl.style.backdropFilter=`blur(${fx.blur}px)`;
  }

  /* date stamp */
  function setDate(){
    const d=new Date();
    const mm=String(d.getMonth()+1).padStart(2,'0');
    const dd=String(d.getDate()).padStart(2,'0');
    const yy=String(d.getFullYear()).slice(2);
    datestamp.textContent="'"+yy+" "+mm+" "+dd;
  }
  setDate();

  /* camera */
  let stream=null;
  async function startCam(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},
        audio:true
      });
      video.srcObject=stream;
      status.textContent='Ready  >  live';
    }catch(err){
      status.textContent='No camera - check permissions';
      caption.textContent='camera access needed';
    }
  }
  startCam();

  /* ---- TAKE PHOTO ---- draw video mirrored, then draw text NON-mirrored ---- */
  function renderPhoto(){
    snap.width=video.videoWidth||1280;
    snap.height=video.videoHeight||960;
    const W=snap.width, H=snap.height;

    // 1. mirrored video frame with film filter
    ctx.save();
    ctx.translate(W,0); ctx.scale(-1,1);
    ctx.filter=(presets[fx.effect]||presets.fadedfilm)();
    ctx.drawImage(video,0,0,W,H);
    ctx.restore();
    ctx.filter='none';

    // 2. vignette
    const g=ctx.createRadialGradient(W/2,H*0.45,H*0.2, W/2,H*0.45,H*0.85);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(20,8,4,${(0.4+fx.fade/100*0.45).toFixed(2)})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // 3. light leaks
    if(fx.leaks){
      const l1=ctx.createRadialGradient(W*0.9,H*0.12,0, W*0.9,H*0.12,W*0.4);
      l1.addColorStop(0,'rgba(255,170,90,0.45)'); l1.addColorStop(1,'rgba(255,170,90,0)');
      ctx.fillStyle=l1; ctx.fillRect(0,0,W,H);
      const l2=ctx.createRadialGradient(W*0.08,H*0.95,0, W*0.08,H*0.95,W*0.45);
      l2.addColorStop(0,'rgba(255,90,140,0.35)'); l2.addColorStop(1,'rgba(255,90,140,0)');
      ctx.fillStyle=l2; ctx.fillRect(0,0,W,H);
    }

    // 4. film grain
    if(fx.grain>0){
      const amt=fx.grain/100;
      const id=ctx.getImageData(0,0,W,H), d=id.data;
      for(let i=0;i<d.length;i+=4){
        const n=(Math.random()-0.5)*120*amt;
        d[i]+=n; d[i+1]+=n; d[i+2]+=n;
      }
      ctx.putImageData(id,0,0);
    }

    // 5. caption  (NOT mirrored - drawn after restore, reads correctly)
    if(caption.textContent.trim()){
      ctx.font=`${Math.round(W/17)}px monospace`;
      ctx.textAlign='center';
      ctx.fillStyle='#ffe9b8';
      ctx.shadowColor='rgba(0,0,0,.85)';
      ctx.shadowOffsetX=2; ctx.shadowOffsetY=2; ctx.shadowBlur=0;
      ctx.fillText(caption.textContent, W/2, H-H/20);
      ctx.shadowColor='transparent'; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
    }

    // 6. date stamp
    if(fx.date){
      ctx.font=`${Math.round(W/26)}px monospace`;
      ctx.textAlign='right';
      ctx.fillStyle='#ff9a3c';
      ctx.fillText(datestamp.textContent, W-W/30, H-H/20);
    }
  }

  function takePhoto(){
    if(!video.videoWidth){status.textContent='Camera not ready...';return;}
    renderPhoto();
    snap.style.display='block';
    snap.style.transform='none';        // already drawn correctly, don't re-mirror
    snap.style.filter='none';
    fx.captured=true;
    status.textContent='Photo captured  -  press save';
  }
  function retake(){
    snap.style.display='none';
    snap.style.transform='scaleX(-1)';
    fx.captured=false;
    status.textContent='Ready  >  live';
  }

  /* ---- DOWNLOAD: capture the FULL window frame via html2canvas ---- */
  async function download(){
    if(!fx.captured) takePhoto();
    status.textContent='Rendering frame...';
    try{
      const canvas=await html2canvas(player,{
        backgroundColor:null, scale:2, useCORS:true, logging:false
      });
      const a=document.createElement('a');
      a.download='y2k-cam-'+Date.now()+'.png';
      a.href=canvas.toDataURL('image/png');
      a.click();
      status.textContent='Saved with frame  <3';
    }catch(e){
      // fallback: just the photo
      const a=document.createElement('a');
      a.download='y2k-cam-'+Date.now()+'.png';
      a.href=snap.toDataURL('image/png');
      a.click();
      status.textContent='Saved (photo only)';
    }
  }

  /* ---- VIDEO RECORDING ---- */
  let recorder=null, chunks=[], recording=false;
  const recordBtn=document.getElementById('record');

  function startRec(){
    if(!stream){status.textContent='No camera stream';return;}
    chunks=[];
    let mime='video/webm;codecs=vp9';
    if(!MediaRecorder.isTypeSupported(mime)) mime='video/webm';
    try{ recorder=new MediaRecorder(stream,{mimeType:mime}); }
    catch(e){ status.textContent='Recording not supported here'; return; }
    recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a');
      a.download='y2k-cam-'+Date.now()+'.webm';
      a.href=URL.createObjectURL(blob);
      a.click();
      status.textContent='Video saved  <3';
    };
    recorder.start();
    recording=true;
    recordBtn.classList.add('recording');
    recdot.classList.add('on');
    status.textContent='Recording...  (tap red dot to stop)';
  }
  function stopRec(){
    if(recorder && recording){
      recorder.stop();
      recording=false;
      recordBtn.classList.remove('recording');
      recdot.classList.remove('on');
    }
  }
  recordBtn.onclick=()=> recording?stopRec():startRec();

  /* note: the recorded .webm is the raw camera feed. the pink frame +
     film filter are a visual layer; browsers can't bake CSS into a
     video stream client-side. the saved video keeps the warm filter
     baked via canvas below. */

  /* --- recording WITH the filter baked in, using a canvas stream --- */
  let rafId=null;
  function startRecFiltered(){
    if(!stream){status.textContent='No camera stream';return;}
    const rec=document.createElement('canvas');
    rec.width=video.videoWidth||1280; rec.height=video.videoHeight||960;
    const rctx=rec.getContext('2d');
    function draw(){
      rctx.save();
      rctx.translate(rec.width,0); rctx.scale(-1,1);
      rctx.filter=(presets[fx.effect]||presets.fadedfilm)();
      rctx.drawImage(video,0,0,rec.width,rec.height);
      rctx.restore();
      rctx.filter='none';
      const g=rctx.createRadialGradient(rec.width/2,rec.height*0.45,rec.height*0.2,
                                        rec.width/2,rec.height*0.45,rec.height*0.85);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(1,`rgba(20,8,4,${(0.4+fx.fade/100*0.45).toFixed(2)})`);
      rctx.fillStyle=g; rctx.fillRect(0,0,rec.width,rec.height);
      rafId=requestAnimationFrame(draw);
    }
    draw();
    const vstream=rec.captureStream(30);
    const atrack=stream.getAudioTracks()[0];
    if(atrack) vstream.addTrack(atrack);
    chunks=[];
    let mime='video/webm';
    try{ recorder=new MediaRecorder(vstream,{mimeType:mime}); }
    catch(e){ status.textContent='Recording not supported'; cancelAnimationFrame(rafId); return; }
    recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    recorder.onstop=()=>{
      cancelAnimationFrame(rafId);
      const blob=new Blob(chunks,{type:'video/webm'});
      const a=document.createElement('a');
      a.download='y2k-cam-'+Date.now()+'.webm';
      a.href=URL.createObjectURL(blob);
      a.click();
      status.textContent='Filtered video saved  <3';
    };
    recorder.start();
    recording=true;
    recordBtn.classList.add('recording');
    recdot.classList.add('on');
    status.textContent='Recording...  (tap red dot to stop)';
  }
  recordBtn.onclick=()=> recording?stopRec():startRecFiltered();

  /* control wiring */
  document.getElementById('shoot').onclick   = takePhoto;
  document.getElementById('shoot2').onclick  = takePhoto;
  document.getElementById('retake').onclick  = retake;
  document.getElementById('retake2').onclick = retake;
  document.getElementById('download').onclick= download;

  document.getElementById('titleInput').oninput=e=>{
    document.getElementById('winTitle').textContent=e.target.value||' ';
  };
  document.getElementById('captionInput').oninput=e=>{
    caption.textContent=e.target.value;
  };

  function bindSlider(id,key,fmt,labelId){
    const el=document.getElementById(id);
    el.oninput=()=>{
      fx[key]=key==='blur'? (+el.value/10):+el.value;
      document.getElementById(labelId).textContent=fmt(el.value);
      applyLook();
    };
  }
  bindSlider('warmth','warmth',v=>v+'%','warmthVal');
  bindSlider('fade','fade',v=>v+'%','fadeVal');
  bindSlider('grainAmt','grain',v=>v+'%','grainVal');
  bindSlider('blurAmt','blur',v=>(v/10).toFixed(1)+'px','blurVal');

  document.getElementById('leakTog').onchange=e=>{fx.leaks=e.target.checked;applyLook();};
  document.getElementById('dateTog').onchange=e=>{fx.date=e.target.checked;applyLook();};

  /* film look chips */
  const effectList=[
    ['fadedfilm','faded film'],['expired','expired'],['polaroid','polaroid'],
    ['camcorder','camcorder'],['coolwash','cool wash'],['sepia','sepia'],['bw','b&w']
  ];
  const effectsBox=document.getElementById('effects');
  effectList.forEach(([key,label])=>{
    const c=document.createElement('div');
    c.className='chip'+(key===fx.effect?' active':'');
    c.textContent=label;
    c.onclick=()=>{
      fx.effect=key;
      [...effectsBox.children].forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      applyLook();
    };
    effectsBox.appendChild(c);
  });

  /* theme color */
  function setTheme(hex){
    const c=hex.replace('#','');
    const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
    const mix=(a,t)=>Math.round(a+(t-a)*0.55);
    root.style.setProperty('--accent',hex);
    root.style.setProperty('--accent-deep',`rgb(${Math.round(r*.6)},${Math.round(g*.6)},${Math.round(b*.6)})`);
    root.style.setProperty('--accent-light',`rgb(${mix(r,255)},${mix(g,255)},${mix(b,255)})`);
    root.style.setProperty('--chrome',`rgb(${Math.round(r+(255-r)*.82)},${Math.round(g+(255-g)*.82)},${Math.round(b+(255-b)*.82)})`);
    root.style.setProperty('--glass',`rgb(${mix(r,255)},${mix(g,255)},${mix(b,255)})`);
  }
  const swatchColors=['#e8489a','#9b5de5','#00bbf9','#43c59e','#ff8c42','#ff5d8f','#3a3a55'];
  const swBox=document.getElementById('swatches');
  swatchColors.forEach((hex,i)=>{
    const s=document.createElement('div');
    s.className='swatch'+(i===0?' active':'');
    s.style.background=hex;
    s.onclick=()=>{
      setTheme(hex);
      document.getElementById('colorPick').value=hex;
      [...swBox.children].forEach(x=>x.classList.remove('active'));
      s.classList.add('active');
    };
    swBox.appendChild(s);
  });
  document.getElementById('colorPick').oninput=e=>{
    setTheme(e.target.value);
    [...swBox.children].forEach(x=>x.classList.remove('active'));
  };

  applyLook();
})();
</script>
</body>
</html>
